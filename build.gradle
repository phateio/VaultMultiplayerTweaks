plugins {
    id 'java'
    id 'net.minecrell.plugin-yml.bukkit' version '0.6.0'
}

group = 'io.github.phateio'
version = '1.1.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // The plugin only uses the public Vault API (no NMS), so the plain API jar is enough.
    // Target server: Leaves/Paper 1.21.11.
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")

    testImplementation("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    testImplementation(platform("org.junit:junit-bom:5.13.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// Compile and target Java 25 (as in PR #1; teatech runs Java 25).
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    // No NMS references: tell Paper not to run the Spigot->Mojang remapper on load.
    manifest.attributes('paperweight-mappings-namespace': 'mojang')
}

bukkit {
    name = project.name
    version = project.version
    main = 'io.github.phateio.vaultMultiplayerTweaks.VaultMultiplayerTweaks'
    apiVersion = '1.21'
    author = "WhiteCat"
}
